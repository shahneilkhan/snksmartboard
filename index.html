<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="SNK Smart Board - Digital Teaching Board"
  >

  <title>SNK Smart Board</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       APP
  ========================== -->
  <div class="app">

    <!-- =========================
         TOP HEADER
    ========================== -->
    <header class="topbar">

      <div class="brand">
        <div class="brand-icon">SNK</div>

        <div>
          <h1>SNK Smart Board</h1>
          <span>Digital Teaching Board</span>
        </div>
      </div>

      <div class="top-actions">

        <button
          class="top-btn"
          id="newBoardBtn"
          type="button"
        >
          <span>＋</span>
          New
        </button>

        <button
          class="top-btn"
          id="saveBtn"
          type="button"
        >
          <span>↓</span>
          Save
        </button>

        <button
          class="top-btn"
          id="fullscreenBtn"
          type="button"
        >
          <span>⛶</span>
          Fullscreen
        </button>

      </div>

    </header>


    <!-- =========================
         MAIN WORKSPACE
    ========================== -->
    <main class="workspace">

      <!-- =========================
           LEFT TOOLBAR
      ========================== -->
      <aside class="toolbar">

        <div class="tool-group">

          <div class="tool-title">
            DRAW
          </div>

          <button
            class="tool-btn active"
            data-tool="pen"
            type="button"
            title="Pen"
          >
            ✎
            <span>Pen</span>
          </button>

          <button
            class="tool-btn"
            data-tool="highlighter"
            type="button"
            title="Highlighter"
          >
            🖍
            <span>Marker</span>
          </button>

          <button
            class="tool-btn"
            data-tool="eraser"
            type="button"
            title="Eraser"
          >
            ◇
            <span>Eraser</span>
          </button>

        </div>


        <div class="tool-group">

          <div class="tool-title">
            COLOR
          </div>

          <input
            type="color"
            id="colorPicker"
            value="#1769ff"
            title="Choose color"
          >

        </div>


        <div class="tool-group">

          <div class="tool-title">
            SIZE
          </div>

          <input
            type="range"
            id="sizeSlider"
            min="1"
            max="40"
            value="5"
          >

          <div
            class="size-value"
            id="sizeValue"
          >
            5 px
          </div>

        </div>


        <div class="tool-group">

          <div class="tool-title">
            EDIT
          </div>

          <button
            class="tool-btn small"
            id="undoBtn"
            type="button"
          >
            ↶
            <span>Undo</span>
          </button>

          <button
            class="tool-btn small"
            id="redoBtn"
            type="button"
          >
            ↷
            <span>Redo</span>
          </button>

          <button
            class="tool-btn small danger"
            id="clearBtn"
            type="button"
          >
            ✕
            <span>Clear</span>
          </button>

        </div>


        <div class="tool-group">

          <div class="tool-title">
            INSERT
          </div>

          <button
            class="tool-btn"
            id="textToolBtn"
            type="button"
          >
            T
            <span>Text</span>
          </button>

          <button
            class="tool-btn"
            id="imageToolBtn"
            type="button"
          >
            🖼
            <span>Image</span>
          </button>

          <button
            class="tool-btn"
            id="pdfToolBtn"
            type="button"
          >
            PDF
            <span>PDF</span>
          </button>

        </div>


        <div class="tool-group">

          <div class="tool-title">
            SHAPES
          </div>

          <button
            class="tool-btn"
            data-shape="rectangle"
            type="button"
          >
            ▭
            <span>Box</span>
          </button>

          <button
            class="tool-btn"
            data-shape="circle"
            type="button"
          >
            ○
            <span>Circle</span>
          </button>

          <button
            class="tool-btn"
            data-shape="line"
            type="button"
          >
            ／
            <span>Line</span>
          </button>

          <button
            class="tool-btn"
            data-shape="arrow"
            type="button"
          >
            ➜
            <span>Arrow</span>
          </button>

        </div>

      </aside>


      <!-- =========================
           BOARD AREA
      ========================== -->
      <section class="board-area">

        <div class="board-wrapper">

          <!-- MEDIA -->
          <div
            class="media-layer"
            id="mediaLayer"
          ></div>

          <!-- DRAWING -->
          <canvas
            id="drawingCanvas"
          ></canvas>

          <!-- TEXT LAYER -->
          <div
            class="text-layer"
            id="textLayer"
          ></div>

          <!-- EMPTY BOARD MESSAGE -->
          <div
            class="welcome"
            id="welcomeMessage"
          >
            <div class="welcome-icon">
              ✎
            </div>

            <h2>SNK Smart Board</h2>

            <p>
              Start writing, drawing or upload your lesson material.
            </p>
          </div>

        </div>


        <!-- =========================
             BOTTOM PAGE BAR
        ========================== -->
        <div class="page-bar">

          <button
            id="prevPageBtn"
            class="page-btn"
            type="button"
          >
            ◀
          </button>

          <div class="page-info">
            Page
            <strong id="currentPage">
              1
            </strong>
            /
            <strong id="totalPages">
              1
            </strong>
          </div>

          <button
            id="nextPageBtn"
            class="page-btn"
            type="button"
          >
            ▶
          </button>

          <button
            id="addPageBtn"
            class="add-page-btn"
            type="button"
          >
            ＋ Add Page
          </button>

        </div>

      </section>

    </main>


    <!-- =========================
         HIDDEN FILE INPUTS
    ========================== -->

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      hidden
    >

    <input
      type="file"
      id="pdfInput"
      accept="application/pdf"
      hidden
    >


    <!-- =========================
         PDF PANEL
    ========================== -->

    <div
      class="pdf-panel"
      id="pdfPanel"
    >

      <div class="pdf-header">

        <strong>
          PDF Viewer
        </strong>

        <button
          id="closePdfBtn"
          type="button"
        >
          ✕
        </button>

      </div>

      <div class="pdf-controls">

        <button
          id="pdfPrevBtn"
          type="button"
        >
          ◀
        </button>

        <div class="pdf-page-control">

          <input
            type="number"
            id="pdfPageInput"
            value="1"
            min="1"
          >

          <span>
            Page
          </span>

        </div>

        <button
          id="pdfNextBtn"
          type="button"
        >
          ▶
        </button>

        <button
          id="pdfZoomOutBtn"
          type="button"
        >
          −
        </button>

        <span
          id="pdfZoomValue"
          class="pdf-zoom-value"
        >
          100%
        </span>

        <button
          id="pdfZoomInBtn"
          type="button"
        >
          ＋
        </button>

        <button
          id="pdfResetBtn"
          type="button"
        >
          Reset
        </button>

      </div>

      <div class="pdf-viewer">

        <iframe
          id="pdfFrame"
          title="PDF Viewer"
        ></iframe>

      </div>

    </div>


    <!-- =========================
         TOAST
    ========================== -->

    <div
      class="toast"
      id="toast"
    ></div>

  </div>


  <script src="script.js"></script>

</body>
</html>
